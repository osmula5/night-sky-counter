<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050817">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Night">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>Night</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { width:100%; height:100%; margin:0; overflow:hidden; }
  body {
    display:grid; place-items:center;
    background:
      radial-gradient(ellipse at 50% 48%, rgba(58,65,135,.34) 0%, transparent 52%),
      radial-gradient(ellipse at 12% 22%, rgba(117,83,150,.20) 0%, transparent 42%),
      radial-gradient(ellipse at 88% 76%, rgba(49,105,153,.20) 0%, transparent 45%),
      radial-gradient(ellipse at 50% 110%, rgba(18,34,82,.30), transparent 58%),
      #070817;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select:none;
  }
  .sky { position:fixed; inset:0; pointer-events:none; overflow:hidden; isolation:isolate; }
  /* Мягкие неподвижные дымки: никаких вспышек или мерцания. */
  .sky::before, .sky::after {
    content:""; position:absolute; inset:-18%;
    pointer-events:none; border-radius:50%;
    filter:blur(42px);
    transform:translateZ(0);
  }
  .sky::before {
    background:
      radial-gradient(ellipse at 22% 34%, rgba(172,139,193,.17) 0%, transparent 24%),
      radial-gradient(ellipse at 68% 24%, rgba(94,132,190,.18) 0%, transparent 27%),
      radial-gradient(ellipse at 72% 76%, rgba(151,115,171,.13) 0%, transparent 25%),
      radial-gradient(ellipse at 28% 82%, rgba(89,133,177,.15) 0%, transparent 29%);
    opacity:.95;
  }
  .sky::after {
    inset:-8%;
    background:
      radial-gradient(ellipse at 50% 12%, rgba(176,155,197,.10) 0%, transparent 30%),
      radial-gradient(ellipse at 8% 62%, rgba(107,140,190,.12) 0%, transparent 25%),
      radial-gradient(ellipse at 92% 42%, rgba(183,145,184,.10) 0%, transparent 26%);
    filter:blur(58px);
  }
  .star {
    position:absolute; width:2px; height:2px; border-radius:50%;
    background:#dce8ff; opacity:var(--o);
    box-shadow:0 0 5px rgba(190,213,255,.55);
  }
  .moon-glow {
    position:fixed; width:min(72vw, 420px); aspect-ratio:1;
    left:50%; top:50%; transform:translate(-50%,-50%);
    border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(161,174,226,.075) 0%, rgba(116,135,196,.035) 34%, transparent 68%);
    filter:blur(7px);
  }
  .center { position:relative; display:grid; place-items:center; }
  #counter {
    position:relative; z-index:2;
    width:min(44vw, 190px); height:min(44vw, 190px);
    min-width:142px; min-height:142px; max-width:190px; max-height:190px;
    border:1px solid rgba(184,205,255,.38);
    border-radius:50%;
    color:#fff;
    font:600 clamp(27px, 8vw, 42px)/1 -apple-system, BlinkMacSystemFont, sans-serif;
    font-variant-numeric:tabular-nums;
    background:
      radial-gradient(circle at 34% 25%, rgba(255,255,255,.25), transparent 27%),
      linear-gradient(145deg, #ff344e 0%, #d20d43 47%, #214cbb 100%);
    box-shadow:
      0 0 18px rgba(35,91,235,.42),
      0 0 42px rgba(37,80,202,.25),
      inset 0 1px 10px rgba(255,255,255,.18),
      inset 0 -10px 22px rgba(4,12,53,.25);
    cursor:pointer; outline:none; touch-action:manipulation;
    transition: box-shadow .22s ease, filter .22s ease;
  }
  #counter:active {
    filter:brightness(1.12);
    box-shadow:0 0 24px rgba(35,91,235,.52), 0 0 54px rgba(37,80,202,.3),
      inset 0 1px 10px rgba(255,255,255,.2), inset 0 -10px 22px rgba(4,12,53,.25);
  }
  .particle {
    position:absolute; z-index:1; width:5px; height:5px; border-radius:50%;
    background:rgba(164,199,255,.9);
    box-shadow:0 0 8px 2px rgba(87,145,255,.45);
    pointer-events:none;
    animation: drift 850ms ease-out forwards;
  }
  @keyframes drift {
    from { opacity:.72; transform:translate(0,0) scale(.8); }
    to { opacity:0; transform:translate(var(--x),var(--y)) scale(.15); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
  <div class="sky" aria-hidden="true" id="sky"></div>
  <div class="moon-glow" aria-hidden="true"></div>
  <main class="center">
    <button id="counter" type="button" aria-label="Увеличить счётчик">0</button>
  </main>
<script>
(() => {
  const key = "quiet-night-counter-v1";
  const button = document.getElementById("counter");
  const sky = document.getElementById("sky");
  let count = 0;

  try {
    const saved = Number.parseInt(localStorage.getItem(key) || "0", 10);
    count = Number.isSafeInteger(saved) && saved >= 0 ? saved : 0;
  } catch (_) {}
  button.textContent = String(count);

  // Неподвижные звёзды — без мерцания и вспышек.
  let seed = 1847;
  const random = () => {
    seed = (seed * 16807) % 2147483647;
    return (seed - 1) / 2147483646;
  };
  for (let i = 0; i < 95; i++) {
    const star = document.createElement("i");
    star.className = "star";
    star.style.left = (random() * 100) + "%";
    star.style.top = (random() * 100) + "%";
    star.style.setProperty("--o", (0.18 + random() * 0.48).toFixed(2));
    sky.appendChild(star);
  }

  button.addEventListener("click", () => {
    if (count < Number.MAX_SAFE_INTEGER) count++;
    button.textContent = String(count);
    try { localStorage.setItem(key, String(count)); } catch (_) {}

    if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      const rect = button.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      for (let i = 0; i < 7; i++) {
        const p = document.createElement("i");
        const angle = (Math.PI * 2 * i / 7) + Math.random() * .22;
        const distance = 30 + Math.random() * 22;
        p.className = "particle";
        p.style.left = cx + "px";
        p.style.top = cy + "px";
        p.style.setProperty("--x", (Math.cos(angle) * distance) + "px");
        p.style.setProperty("--y", (Math.sin(angle) * distance) + "px");
        document.body.appendChild(p);
        p.addEventListener("animationend", () => p.remove(), { once:true });
      }
    }
  });
})();
</script>
</body>
</html>
